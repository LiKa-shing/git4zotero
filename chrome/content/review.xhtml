<?xml version="1.0" encoding="UTF-8"?>
<!DOCTYPE html>
<html xmlns="http://www.w3.org/1999/xhtml">
<head>
  <meta charset="UTF-8" />
  <title>git4zotero</title>
  <link rel="stylesheet" href="chrome://git4zotero/content/review.css" />
  <script src="chrome://git4zotero/content/review-window.js" defer="defer"></script>
</head>
<body>
  <header class="review-header">
    <div>
      <h1 id="review-title">git4zotero</h1>
      <div id="review-version-meta" class="review-meta"></div>
    </div>
    <div class="review-actions">
      <button id="review-copy-filtered" type="button"></button>
      <button id="review-copy-all" type="button"></button>
      <button id="review-export" type="button"></button>
    </div>
  </header>
  <div class="review-toolbar">
    <label class="review-search"><span id="review-search-label"></span><input id="review-query" type="search" /></label>
    <fieldset id="review-type-filter" class="review-type-filter">
      <legend id="review-type-label" class="visually-hidden"></legend>
      <div id="review-type-options" class="review-type-options"></div>
    </fieldset>
    <span id="review-quality" class="review-quality"></span>
    <span id="review-status" class="review-status" role="status"></span>
  </div>
  <div id="review-compare-toolbar" class="review-compare-toolbar" hidden="hidden">
    <div class="review-version-picker"><span id="review-baseline-label"></span><button id="review-baseline-button" type="button" aria-haspopup="listbox" aria-expanded="false"></button><div id="review-baseline-options" class="review-version-options" role="listbox" hidden="hidden"></div></div>
    <div class="review-version-picker"><span id="review-target-label"></span><button id="review-target-button" type="button" aria-haspopup="listbox" aria-expanded="false"></button><div id="review-target-options" class="review-version-options" role="listbox" hidden="hidden"></div></div>
    <button id="review-run-compare" type="button"></button>
  </div>
  <div class="review-selection-toolbar">
    <button id="review-select-page" type="button"></button>
    <button id="review-clear-selection" type="button"></button>
    <button id="review-next-unreviewed" type="button"></button>
    <label class="review-minor-filter"><input id="review-hide-minor" type="checkbox" /><span id="review-hide-minor-label"></span></label>
    <span id="review-selected-count" class="review-status"></span>
    <button id="review-ai-generate" type="button" hidden="hidden"></button>
    <button id="review-ai-clear-cache" type="button" hidden="hidden"></button>
  </div>
  <main class="review-layout">
    <nav class="review-navigation" aria-labelledby="review-sections-title">
      <h2 id="review-sections-title"></h2>
      <button id="review-all-groups" class="review-group active" type="button"></button>
      <div id="review-groups"></div>
    </nav>
    <section class="review-content" aria-live="polite">
      <section id="review-ai-result" class="review-ai-result" hidden="hidden"></section>
      <div id="review-list"></div>
      <div class="review-pagination">
        <button id="review-previous" type="button"></button>
        <label><span id="review-page-label"></span><input id="review-page" type="number" min="1" value="1" /></label>
        <span id="review-page-count"></span>
        <button id="review-next" type="button"></button>
      </div>
    </section>
  </main>
  <section id="review-ai-modal" class="review-modal" role="dialog" aria-modal="true" aria-labelledby="review-ai-modal-title" hidden="hidden">
    <div class="review-modal-backdrop"></div>
    <div class="review-modal-panel">
      <h2 id="review-ai-modal-title"></h2>
      <p id="review-ai-warning"></p>
      <p id="review-ai-meta" class="review-meta"></p>
      <textarea id="review-ai-preview" readonly="readonly"></textarea>
      <div class="review-actions">
        <button id="review-ai-confirm" type="button"></button>
        <button id="review-ai-cancel" type="button"></button>
      </div>
    </div>
  </section>
</body>
</html>
